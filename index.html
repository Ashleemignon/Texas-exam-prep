<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Texas Life, Health & Annuity Exam - 20-Question Mastery Mode</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-inner: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #475569;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --correct-bg: #064e3b;
      --correct-border: #10b981;
      --correct-text: #a7f3d0;
      --incorrect-bg: #7f1d1d;
      --incorrect-border: #ef4444;
      --incorrect-text: #fecaca;
      --accent: #60a5fa;
      --gold: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px 12px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px 18px;
      border: 1px solid var(--border-color);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.15rem;
      color: var(--accent);
    }

    .set-select-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    select {
      background: var(--card-inner);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .progress-container {
      width: 100%;
      height: 8px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      transition: width 0.3s ease;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 22px 18px;
      border: 1px solid var(--border-color);
    }

    .category-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      background: rgba(96, 165, 250, 0.12);
      border: 1px solid rgba(96, 165, 250, 0.3);
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .question-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 13px 15px;
      font-size: 0.94rem;
      line-height: 1.4;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.2s ease;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: #475569;
    }

    .option-btn:disabled {
      cursor: not-allowed;
    }

    .option-key {
      font-weight: 700;
      min-width: 20px;
      color: var(--accent);
    }

    .option-btn.selected-correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text) !important;
      font-weight: 600;
    }

    .option-btn.selected-incorrect {
      background-color: var(--incorrect-bg) !important;
      border-color: var(--incorrect-border) !important;
      color: var(--incorrect-text) !important;
      font-weight: 600;
    }

    .option-btn.show-correct {
      border-color: var(--correct-border) !important;
      background-color: #064e3b !important;
      color: var(--correct-text) !important;
    }

    .explanation-box {
      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .explanation-box.correct {
      background: rgba(6, 78, 59, 0.4);
      border-left: 4px solid var(--correct-border);
      color: var(--correct-text);
    }

    .explanation-box.incorrect {
      background: rgba(127, 29, 29, 0.4);
      border-left: 4px solid var(--incorrect-border);
      color: var(--incorrect-text);
    }

    .explanation-box strong {
      display: block;
      margin-bottom: 4px;
      font-size: 0.98rem;
    }

    .controls {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .action-btn {
      padding: 11px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: inline-block;
      transition: background 0.2s ease;
    }

    .action-btn:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      margin-right: 8px;
    }

    .btn-secondary:hover {
      background: #475569;
    }

    /* Set Mastery Card */
    .mastery-screen {
      display: none;
      text-align: center;
      padding: 36px 18px;
    }

    .score-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
    }

    .score-pass {
      background: #059669;
      border: 4px solid #10b981;
    }

    .score-fail {
      background: #b91c1c;
      border: 4px solid #ef4444;
    }

    .mastery-title {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }

    .mastery-desc {
      color: var(--text-sub);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-top">
        <h1>Texas Insurance Exam Prep</h1>
        <div class="set-select-wrap">
          <label for="set-selector" style="font-size:0.8rem; color:var(--text-sub);">Active Set:</label>
          <select id="set-selector" onchange="changeSet(this.value)">
            <option value="0">Set 1 (Q 1–20)</option>
            <option value="1">Set 2 (Q 21–40)</option>
            <option value="2">Set 3 (Q 41–60)</option>
            <option value="3">Set 4 (Q 61–80)</option>
            <option value="4">Set 5 (Q 81–100)</option>
            <option value="5">Set 6 (Q 101–120)</option>
            <option value="6">Set 7 (Q 121–140)</option>
            <option value="7">Set 8 (Q 141–145)</option>
          </select>
        </div>
      </div>
      <div class="meta-bar">
        <span id="question-progress">Question 1 of 20</span>
        <span id="live-score">Set Score: 0/0 (0%)</span>
      </div>
      <div class="progress-container">
        <div class="progress-fill" id="progress-bar"></div>
      </div>
    </header>

    <!-- Question View -->
    <main class="card" id="quiz-card">
      <span class="category-badge" id="category-badge">Category</span>
      <h2 class="question-title" id="question-text">Loading question...</h2>

      <div class="options-list" id="options-container">
        <!-- Injected via JavaScript -->
      </div>

      <div class="explanation-box" id="explanation-box">
        <strong id="feedback-heading"></strong>
        <p id="explanation-text"></p>
      </div>

      <div class="controls">
        <button class="action-btn" id="next-btn" style="display:none;" onclick="nextQuestion()">Next Question &rarr;</button>
      </div>
    </main>

    <!-- Set Mastery & Review Screen -->
    <section class="card mastery-screen" id="mastery-screen">
      <div class="score-circle" id="score-circle">0%</div>
      <h2 class="mastery-title" id="mastery-title">Set Complete</h2>
      <p class="mastery-desc" id="mastery-desc"></p>
      <div class="btn-group">
        <button class="action-btn btn-secondary" onclick="retestActiveSet()">↺ Rearrange & Retest This Set</button>
        <button class="action-btn" id="next-set-btn" onclick="advanceNextSet()">Next Set &rarr;</button>
      </div>
    </section>
  </div>

  <script>
    const masterBank = [
      // Questions 1-10
      {
        category: "General Insurance Concepts & Contract Law",
        question: "An applicant applies for a life insurance policy without submitting the initial premium. The producer delivers the policy three weeks later. What must the producer collect at the time of delivery before coverage becomes legally effective?",
        options: [
          "An endorsement from the Texas Department of Insurance",
          "The full premium and a signed Statement of Good Health",
          "A notarized insurable interest certification",
          "An inspection receipt signed by the beneficiary"
        ],
        answer: 1,
        explanation: "If a policy is issued without an initial premium, coverage is not effective until the producer delivers the policy, collects the premium, and obtains a signed Statement of Good Health verifying insurability."
      },
      {
        category: "General Insurance Concepts & Contract Law",
        question: "Under the doctrine of adhesion, if an insurance policy contains ambiguous language, how will a court interpret the contract in a legal dispute?",
        options: [
          "In favor of the insurer because they drafted the contract",
          "In favor of the insured because the contract is written on a 'take-it-or-leave-it' basis",
          "As null and void due to lack of mutual assent",
          "By dividing the liability equally between both parties"
        ],
        answer: 1,
        explanation: "Contracts of adhesion are drafted by one party without negotiation. Ambiguous language is strictly interpreted in favor of the insured."
      },
      {
        category: "General Insurance Concepts & Contract Law",
        question: "Which legal principle prevents an insurance company from denying a claim based on a right it previously surrendered or failed to enforce?",
        options: [
          "Indemnity",
          "Estoppel",
          "Warranty",
          "Subrogation"
        ],
        answer: 1,
        explanation: "Waiver is the voluntary surrender of a known right. Estoppel legally prevents the party from re-asserting that surrendered right after the other party has reasonably relied upon it."
      },
      {
        category: "General Insurance Concepts & Contract Law",
        question: "An insurance contract is classified as an aleatory contract because:",
        options: [
          "Only one party makes an enforceable promise",
          "The terms are drafted exclusively by the insurer",
          "The exchange of values between the parties is unequal",
          "It relies on the utmost good faith of both parties"
        ],
        answer: 2,
        explanation: "Aleatory contracts feature an unequal exchange of monetary value. An insured may pay small premiums and receive a massive payout, or pay for decades with no claims."
      },
      {
        category: "General Insurance Concepts & Contract Law",
        question: "At what point must insurable interest exist in a Life Insurance contract?",
        options: [
          "At the time of the insured's death",
          "Continuously throughout the entire life of the policy",
          "At the time of policy application and inception",
          "When the beneficiary submits the final proof of loss"
        ],
        answer: 2,
        explanation: "In life insurance, insurable interest must exist only at the time of application/inception. It does not need to exist when the insured passes away."
      },
      {
        category: "General Insurance Concepts & Contract Law",
        question: "Statements made by an applicant on an application for life or health insurance are legally considered to be:",
        options: [
          "Warranties",
          "Representations",
          "Guarantees",
          "Unilateral promises"
        ],
        answer: 1,
        explanation: "Under Texas Insurance Code, statements on an application are representations (statements believed to be true to the best of knowledge), not warranties."
      },
      {
        category: "General Insurance Concepts & Contract Law",
        question: "An agent provides misleading advice leading a client to believe elective cosmetic procedures are covered under their major medical policy. Which type of authority is at issue?",
        options: [
          "Express authority",
          "Implied authority",
          "Apparent authority",
          "Inherent authority"
        ],
        answer: 2,
        explanation: "Apparent authority occurs when actions or representations by an agent lead a reasonable third party to believe the agent possessed authority to bind the company."
      },
      {
        category: "General Insurance Concepts & Contract Law",
        question: "Which element of a valid legal contract is missing if an insurance application is completed by an individual who is legally intoxicated?",
        options: [
          "Competent parties",
          "Legal purpose",
          "Consideration",
          "Offer and acceptance"
        ],
        answer: 0,
        explanation: "To be binding, all parties must possess legal competence. Intoxication, minority, and severe mental impairment compromise legal capacity."
      },
      {
        category: "General Insurance Concepts & Contract Law",
        question: "In an insurance transaction, what constitutes the Consideration provided by the applicant?",
        options: [
          "The insurer's promise to pay claims",
          "The completed application and initial premium payment",
          "The underwriting risk assessment",
          "The insurable interest acknowledgment"
        ],
        answer: 1,
        explanation: "Consideration is the value given in exchange. The applicant provides the completed application plus premium; the insurer provides the promise to pay covered claims."
      },
      {
        category: "General Insurance Concepts & Contract Law",
        question: "An agent issues a Conditional Receipt upon receiving an application and check. If the applicant dies in an accident two days later prior to policy delivery, what does the insurer do?",
        options: [
          "Return the premium and deny the claim because the policy was not delivered",
          "Pay the death benefit if the applicant would have been approved as a standard risk on the receipt date",
          "Pay 50% of the face amount as a settlement",
          "Deny the claim automatically because underwriting was incomplete"
        ],
        answer: 1,
        explanation: "Under a conditional receipt, coverage is effective as of the date of application or medical exam, provided the applicant was insurable under standard guidelines on that date."
      },

      // Questions 11-20
      {
        category: "Life Insurance Policies & Riders",
        question: "A 30-year-old client wants permanent life insurance but can only afford lower premiums now, expecting their salary to double in 5 years. Which policy fits best?",
        options: [
          "Continuous-Premium Whole Life",
          "Modified Whole Life",
          "20-Pay Life",
          "Single Premium Life"
        ],
        answer: 1,
        explanation: "Modified Whole Life starts with lower premiums for the first 3 to 5 years, then steps up to a permanent, fixed level premium for the remainder of life."
      },
      {
        category: "Life Insurance Policies & Riders",
        question: "Which life insurance policy allows the policyowner to adjust death benefits, vary premiums, and skip payments as long as the cash value covers monthly deductions?",
        options: [
          "Variable Life",
          "Universal Life",
          "Decreasing Term Life",
          "Industrial Life"
        ],
        answer: 1,
        explanation: "Universal Life is a flexible-premium adjustable life policy allowing the owner to change death benefits, vary premium amounts, and skip payments if cash value covers deductions."
      },
      {
        category: "Life Insurance Policies & Riders",
        question: "Under a 20-Pay Whole Life policy, when does the cash value equal the face amount (maturity)?",
        options: [
          "At the end of the 20-year payment period",
          "At age 65",
          "At age 100 or 121",
          "Whenever total premiums paid equal the death benefit"
        ],
        answer: 2,
        explanation: "A limited-pay policy condenses premium payments into a set time window (20 years), but maturity (cash value equaling face value) still occurs at age 100 or 121."
      },
      {
        category: "Life Insurance Policies & Riders",
        question: "Which type of term life insurance is commonly used to cover a declining mortgage or commercial amortized loan?",
        options: [
          "Level Term",
          "Increasing Term",
          "Decreasing Term",
          "Renewable Term"
        ],
        answer: 2,
        explanation: "Decreasing Term insurance features a level premium while the death benefit decreases over time, mirroring the payoff of amortized debt."
      },
      {
        category: "Life Insurance Policies & Riders",
        question: "An insured holds a whole life policy with an Accidental Death Benefit (ADB) rider for $100,000. If the insured passes away from a heart attack, what will the policy pay?",
        options: [
          "The base policy face amount plus $100,000",
          "The base policy face amount only",
          "Double the base policy face amount",
          "The cash surrender value only"
        ],
        answer: 1,
        explanation: "ADB riders pay an additional benefit only if death is the direct result of an external accident. Natural medical causes (like a heart attack) pay only the base face amount."
      },
      {
        category: "Life Insurance Policies & Riders",
        question: "What rider guarantees that a life insurance policy will stay in force without premium payments if the insured becomes totally and permanently disabled?",
        options: [
          "Payor Benefit Rider",
          "Guaranteed Insurability Rider",
          "Waiver of Premium Rider",
          "Accelerated Death Benefit Rider"
        ],
        answer: 2,
        explanation: "The Waiver of Premium Rider waives ongoing premium payments during a period of qualified total disability, typically after a 6-month waiting period."
      },
      {
        category: "Life Insurance Policies & Riders",
        question: "A mother purchases a life policy on her 10-year-old child. Which rider waives premium payments if the mother dies or becomes disabled before the child reaches adulthood?",
        options: [
          "Waiver of Cost of Insurance",
          "Payor Benefit Rider",
          "Return of Premium Rider",
          "Family Term Rider"
        ],
        answer: 1,
        explanation: "The Payor Benefit rider waives premiums on a juvenile policy if the adult payor dies or becomes disabled, continuing until the child reaches a designated age (such as 21 or 25)."
      },
      {
        category: "Life Insurance Policies & Riders",
        question: "Under the Guaranteed Insurability Rider (GIR), the policyowner can purchase additional insurance amounts:",
        options: [
          "At specified future dates or milestones without proving evidence of insurability",
          "At any time by paying back premiums plus interest",
          "Free of charge if diagnosed with a terminal illness",
          "Equal to the accumulated cash value every five years"
        ],
        answer: 0,
        explanation: "GIR allows the insured to purchase stated increments of permanent coverage at specific intervals or milestones without medical underwriting."
      },
      {
        category: "Life Insurance Policies & Riders",
        question: "Under what circumstance does an Accelerated Death Benefit (Living Needs) Rider pay out?",
        options: [
          "Involuntary loss of employment",
          "Qualifying terminal illness with a limited life expectancy (typically 12–24 months)",
          "Reaching age 65",
          "Exhaustion of regular unemployment insurance"
        ],
        answer: 1,
        explanation: "Accelerated Death Benefit riders allow policyholders early, tax-free access to a portion of the death benefit if diagnosed with a terminal illness or catastrophic condition."
      },
      {
        category: "Life Insurance Policies & Riders",
        question: "A policyowner fails to pay their annual life insurance premium on the due date. Which provision keeps the coverage in force?",
        options: [
          "Incontestability Clause",
          "Grace Period Provision",
          "Reinstatement Clause",
          "Entire Contract Clause"
        ],
        answer: 1,
        explanation: "The Grace Period (typically 30 or 31 days) maintains policy coverage past the due date. If death occurs during this window, unpaid premiums are deducted from the payout."
      },

      // Questions 21-40
      {
        category: "Life Insurance Policies & Riders",
        question: "An insured borrows $15,000 against their whole life cash value. If the insured dies before repaying the loan, what is paid to the beneficiary?",
        options: [
          "Zero, because an unpaid loan cancels the contract",
          "The full face amount, with the balance collected from the estate",
          "The face amount minus the $15,000 loan balance and any accrued interest",
          "The cash surrender value only"
        ],
        answer: 2,
        explanation: "Policy loans are secured by the death benefit. Any outstanding balance plus interest is deducted from the gross death benefit payout."
      },
      {
        category: "Life Insurance Policies & Riders",
        question: "Which of the following is NOT one of the three statutory Nonforfeiture Options?",
        options: [
          "Cash Surrender Value",
          "Reduced Paid-Up Insurance",
          "Extended Term Insurance",
          "Paid-Up Additions"
        ],
        answer: 3,
        explanation: "Paid-Up Additions is a Dividend Option. The three statutory nonforfeiture options are Cash Surrender, Reduced Paid-Up, and Extended Term."
      },
      {
        category: "Life Insurance Policies & Riders",
        question: "Under the Reduced Paid-Up nonforfeiture option, the policy's net cash value is used to purchase:",
        options: [
          "Term insurance for the original face amount for a temporary duration",
          "A fully paid-up permanent policy with a reduced face amount for life",
          "An immediate annuity",
          "Variable equity sub-accounts"
        ],
        answer: 1,
        explanation: "Reduced Paid-Up uses accumulated cash value as a single net premium to purchase a permanent policy of the same type, with a reduced face amount and no future premiums due."
      },
      {
        category: "Life Insurance Policies & Riders",
        question: "Which Dividend Option allows a participating policyowner to use their annual dividend to purchase 1-year term insurance?",
        options: [
          "Accumulation at Interest",
          "Paid-Up Additions",
          "Fifth Dividend Option (One-Year Term)",
          "Cash Option"
        ],
        answer: 2,
        explanation: "The Fifth Dividend Option directs the insurer to use dividends to buy one-year term insurance, often up to the cash value amount."
      },
      {
        category: "Life Insurance Policies & Riders",
        question: "An applicant reports their age as 32 instead of 36 on an application and dies 5 years later. Under the Misstatement of Age Provision, what does the insurer do?",
        options: [
          "Void the contract and refund premiums",
          "Deny the claim because of misrepresentation",
          "Adjust the death benefit to the amount the actual premiums paid would have purchased at age 36",
          "Pay the full face amount because the incontestable period expired"
        ],
        answer: 2,
        explanation: "The Misstatement of Age and Gender provision is never restricted by the incontestable clause; the insurer adjusts benefits to match what the premiums would have bought at the true age."
      },
      {
        category: "Annuities & Retirement Concepts",
        question: "During the accumulation phase of a non-qualified deferred annuity, how are investment earnings taxed?",
        options: [
          "Taxed annually as capital gains",
          "Tax-deferred until distributed",
          "Subject to a 10% penalty each year",
          "100% tax-free upon withdrawal"
        ],
        answer: 1,
        explanation: "Interest and earnings inside an annuity grow on a tax-deferred basis, meaning taxes are postponed until withdrawals or income payments begin."
      },
      {
        category: "Annuities & Retirement Concepts",
        question: "An annuitant selects a Life Income with 10-Year Period Certain option. If the annuitant dies 4 years into payouts, what happens to the remaining balance?",
        options: [
          "Payments cease immediately",
          "The remaining 6 years of guaranteed payments are paid to the beneficiary",
          "The beneficiary receives a lump-sum refund of all original principal",
          "The insurer absorbs the remaining contract value"
        ],
        answer: 1,
        explanation: "Under a Life with Period Certain payout, income is guaranteed for life or the chosen term. If death occurs within the period, the beneficiary receives the remainder of that term."
      },
      {
        category: "Annuities & Retirement Concepts",
        question: "Which annuity settlement option offers the highest monthly payout for a given principal, but ceases all payments upon death?",
        options: [
          "Joint and Survivor Life",
          "Life with Cash Refund",
          "Pure (Straight) Life",
          "Installment Refund"
        ],
        answer: 2,
        explanation: "Pure/Straight Life provides the highest periodic income because there are no refund provisions or survivor guarantees; payments terminate upon death."
      },
      {
        category: "Annuities & Retirement Concepts",
        question: "A 52-year-old withdraws $20,000 from a non-qualified annuity with $30,000 basis and $25,000 in interest earnings. What are the tax consequences?",
        options: [
          "Tax-free return of basis under FIFO rules",
          "Taxable as ordinary income plus a 10% IRS early withdrawal penalty",
          "Taxable as long-term capital gains without penalty",
          "Only the 10% penalty applies"
        ],
        answer: 1,
        explanation: "Non-qualified annuity withdrawals follow LIFO taxation; earnings come out first and are taxed as ordinary income. Withdrawals before age 59½ incur an additional 10% IRS penalty."
      },
      {
        category: "Annuities & Retirement Concepts",
        question: "Which annuity credits interest linked to an outside benchmark (e.g., S&P 500) while offering a guaranteed floor against principal loss?",
        options: [
          "Variable Annuity",
          "Fixed Indexed Annuity (FIA)",
          "Immediate Straight Annuity",
          "Market Value Adjusted Annuity"

      {

        answer: 1,

      },
      {

        options: [

        ],

      },
      {

        options: [
          "A Domestic insurer",

          "An Alien insurer",

        ],
        answer: 0,
        explanation: "An insurer chartered and formed under the laws of Texas is a Domestic insurer in Texas."
      },

      // Questions 141-145
      {
        category: "Texas Statutes, Rules & Licensing Regulations",
        question: "Under Texas law, an insurance company formed in Canada and licensed to do business in Dallas is classified as:",
        options: [
          "Domestic",
          "Foreign",
          "Alien",
          "Non-admitted"
        ],
        answer: 2,
        explanation: "Insurers chartered outside the United States are classified under state law as Alien insurers."
      },
      {
        category: "Texas Statutes, Rules & Licensing Regulations",
        question: "Which of the following is considered an unfair practice under the Texas Unfair Claims Settlement Practices Act?",
        options: [
          "Requesting a claimant submit a sworn proof of loss",
          "Failing to settle a claim promptly when liability has become reasonably clear",
          "Requiring medical records before approving major surgery claims",
          "Denying a claim for an excluded condition clearly listed in the policy"
        ],
        answer: 1,
        explanation: "Failing to attempt in good faith to effectuate prompt, fair, and equitable claim settlements where liability is reasonably clear is an unfair settlement practice."
      },
      {
        category: "Texas Statutes, Rules & Licensing Regulations",
        question: "Under Texas law, an agent who issues a life insurance illustration must:",
        options: [
          "Guarantee that projected interest rates will never decrease",
          "Provide a basic illustration that conforms to TDI standards and ensure it is not represented as guaranteed",
          "Require the policyowner to notarize every page",
          "Submit the illustration to TDI 30 days prior to use"
        ],
        answer: 1,
        explanation: "Life insurance illustrations must strictly adhere to TDI disclosure rules and clearly differentiate guaranteed from non-guaranteed values."
      },
      {
        category: "Texas Statutes, Rules & Licensing Regulations",
        question: "In Texas, how long must an insurance company retain records of all published advertisements and marketing materials?",
        options: [
          "1 year",
          "2 years",

        ],
        answer: 3,
        explanation: "Insurers must maintain records of all advertising and promotional materials for at least 4 years or until the next examination by TDI."
      },
      {
        category: "Texas Statutes, Rules & Licensing Regulations",
        question: "If an insurance producer changes their legal name, business address, or email address, they must notify the Texas Department of Insurance within:",
        options: [
          "10 days",
          "20 days",
          "30 days",
          "60 days"
        ],
        answer: 2,
        explanation: "Producers must notify the Texas Department of Insurance within 30 days of any change to their name, business address, residence, or email."
      }
    ];

    // State Variables
    let currentSetIndex = 0;
    let setQuestions = [];
    let currentInSetIndex = 0;
    let score = 0;
    let answeredInSet = 0;
    let hasAnsweredCurrent = false;

    // Elements
    const quizCard = document.getElementById("quiz-card");
    const masteryScreen = document.getElementById("mastery-screen");
    const categoryBadge = document.getElementById("category-badge");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const explanationBox = document.getElementById("explanation-box");
    const feedbackHeading = document.getElementById("feedback-heading");
    const explanationText = document.getElementById("explanation-text");
    const nextBtn = document.getElementById("next-btn");
    const questionProgress = document.getElementById("question-progress");
    const liveScore = document.getElementById("live-score");
    const progressBar = document.getElementById("progress-bar");
    const setSelector = document.getElementById("set-selector");

    // Shuffle Array Utility
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // Shuffle Options within a Question
    function shuffleOptions(q) {
      const originalOptions = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.answer }));
      const shuffled = shuffleArray(originalOptions);
      return {
        ...q,
        options: shuffled.map(o => o.text),
        answer: shuffled.findIndex(o => o.isCorrect)
      };
    }

    // Load or Slice the Active 20-Question Set and Scramble It
    function loadSet(setIdx, randomize = true) {
      currentSetIndex = parseInt(setIdx);
      setSelector.value = currentSetIndex;

      const start = currentSetIndex * 20;
      const end = Math.min(start + 20, masterBank.length);
      const rawSlice = masterBank.slice(start, end);

      if (randomize) {
        // Scramble strictly within this 20-question set
        setQuestions = shuffleArray(rawSlice).map(q => shuffleOptions(q));
      } else {
        setQuestions = rawSlice.map(q => shuffleOptions(q));
      }

      currentInSetIndex = 0;
      score = 0;
      answeredInSet = 0;

      saveState();
      renderQuestion();
    }

    function saveState() {
      const state = {
        currentSetIndex,
        setQuestions,
        currentInSetIndex,
        score,
        answeredInSet
      };
      localStorage.setItem("tx_set_mastery_state", JSON.stringify(state));
    }

    function init() {
      const saved = localStorage.getItem("tx_set_mastery_state");
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          currentSetIndex = parsed.currentSetIndex;
          setQuestions = parsed.setQuestions;
          currentInSetIndex = parsed.currentInSetIndex;
          score = parsed.score;
          answeredInSet = parsed.answeredInSet;
          setSelector.value = currentSetIndex;
          renderQuestion();
          return;
        } catch(e) {
          console.error(e);
        }
      }
      loadSet(0, true);
    }

    function changeSet(newIndex) {
      quizCard.style.display = "block";
      masteryScreen.style.display = "none";
      loadSet(newIndex, true);
    }

    function renderQuestion() {
      hasAnsweredCurrent = false;
      nextBtn.style.display = "none";
      explanationBox.style.display = "none";
      explanationBox.className = "explanation-box";

      const currentQ = setQuestions[currentInSetIndex];
      categoryBadge.textContent = currentQ.category;
      questionText.textContent = `${currentInSetIndex + 1}. ${currentQ.question}`;

      questionProgress.textContent = `Question ${currentInSetIndex + 1} of ${setQuestions.length}`;
      progressBar.style.width = `${((currentInSetIndex) / setQuestions.length) * 100}%`;

      const pct = answeredInSet > 0 ? Math.round((score / answeredInSet) * 100) : 0;
      liveScore.textContent = `Set Score: ${score}/${answeredInSet} (${pct}%)`;

      optionsContainer.innerHTML = "";
      const letters = ["A", "B", "C", "D"];

      currentQ.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `<span class="option-key">${letters[idx]})</span><span>${opt}</span>`;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIndex) {
      if (hasAnsweredCurrent) return;
      hasAnsweredCurrent = true;
      answeredInSet++;

      const currentQ = setQuestions[currentInSetIndex];
      const buttons = optionsContainer.getElementsByClassName("option-btn");
      const isCorrect = (selectedIndex === currentQ.answer);

      if (isCorrect) {
        score++;
        buttons[selectedIndex].classList.add("selected-correct");
        feedbackHeading.textContent = "Correct!";
        explanationBox.classList.add("correct");
      } else {
        buttons[selectedIndex].classList.add("selected-incorrect");
        buttons[currentQ.answer].classList.add("show-correct");
        feedbackHeading.textContent = "Incorrect";
        explanationBox.classList.add("incorrect");
      }

      Array.from(buttons).forEach(btn => btn.disabled = true);

      explanationText.textContent = currentQ.explanation;
      explanationBox.style.display = "block";

      const pct = Math.round((score / answeredInSet) * 100);
      liveScore.textContent = `Set Score: ${score}/${answeredInSet} (${pct}%)`;

      saveState();

      if (currentInSetIndex === setQuestions.length - 1) {
        nextBtn.textContent = "View Set Results";
      } else {
        nextBtn.textContent = "Next Question →";
      }
      nextBtn.style.display = "inline-block";
    }

    function nextQuestion() {
      if (currentInSetIndex < setQuestions.length - 1) {
        currentInSetIndex++;
        saveState();
        renderQuestion();
      } else {
        showSetSummary();
      }
    }

    function showSetSummary() {
      quizCard.style.display = "none";
      masteryScreen.style.display = "block";
      progressBar.style.width = "100%";

      const finalPct = Math.round((score / setQuestions.length) * 100);
      const scoreCircle = document.getElementById("score-circle");
      const masteryTitle = document.getElementById("mastery-title");
      const masteryDesc = document.getElementById("mastery-desc");
      const nextSetBtn = document.getElementById("next-set-btn");

      scoreCircle.textContent = `${finalPct}%`;

      if (finalPct >= 70) {
        scoreCircle.className = "score-circle score-pass";
        masteryTitle.textContent = `Set ${currentSetIndex + 1} Mastered!`;
        masteryDesc.innerHTML = `Great work! You scored <strong>${score}/${setQuestions.length} (${finalPct}%)</strong>. You have demonstrated passing competency on this 20-question cluster. You can rearrange and retake it for 100% mastery, or advance to the next set.`;
      } else {
        scoreCircle.className = "score-circle score-fail";
        masteryTitle.textContent = `Set ${currentSetIndex + 1} Needs Review`;
        masteryDesc.innerHTML = `You scored <strong>${score}/${setQuestions.length} (${finalPct}%)</strong>. Click "Rearrange & Retest" to scramble these exact questions in a new order and try again.`;
      }

      // Hide or show advance button
      if (currentSetIndex >= 7) {
        nextSetBtn.style.display = "none";
      } else {
        nextSetBtn.style.display = "inline-block";
      }
    }

    function retestActiveSet() {
      masteryScreen.style.display = "none";
      quizCard.style.display = "block";
      loadSet(currentSetIndex, true);
    }

    function advanceNextSet() {
      if (currentSetIndex < 7) {
        masteryScreen.style.display = "none";
        quizCard.style.display = "block";
        loadSet(currentSetIndex + 1, true);
      }
    }

    window.onload = init;
  </script>
</body>
